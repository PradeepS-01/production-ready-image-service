version: "3"

services:
  backend:
    build:
      context: ./backend
    container_name: backend
    volumes:
      - ./backend/uploads:/app/uploads
    expose:
      - "5000"  

  nginx:
    image: nginx:latest
    container_name: image_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend/uploads:/usr/share/nginx/html/uploads
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
